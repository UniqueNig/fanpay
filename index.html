<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FanPay – Fund Your Wallet, Sort Every Bill</title>
    <meta name="description" content="FanPay — buy airtime and data, pay electricity and cable TV bills, all from one simple wallet." />
    <link rel="canonical" href="https://fanpay-peach.vercel.app/" />

    <!-- Static fallback for crawlers/link-preview bots that don't run JavaScript
         (Facebook, Twitter, WhatsApp, Slack, etc. all read raw HTML only) —
         src/components/SEO.jsx overrides these per-page for browsers and
         Googlebot, which does execute JS, but this is what a shared link
         actually shows a real person before that ever runs. -->
    <meta property="og:site_name" content="FanPay" />
    <meta property="og:title" content="FanPay – Fund Your Wallet, Sort Every Bill" />
    <meta property="og:description" content="FanPay — buy airtime and data, pay electricity and cable TV bills, all from one simple wallet." />
    <meta property="og:url" content="https://fanpay-peach.vercel.app/" />
    <meta property="og:image" content="https://fanpay-peach.vercel.app/og-image.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FanPay – Fund Your Wallet, Sort Every Bill" />
    <meta name="twitter:description" content="FanPay — buy airtime and data, pay electricity and cable TV bills, all from one simple wallet." />
    <meta name="twitter:image" content="https://fanpay-peach.vercel.app/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <script>
      // Set data-theme before first paint so the app shell doesn't flash the
      // wrong theme — ThemeContext reads this same value back on mount.
      (function () {
        try {
          var saved = localStorage.getItem("fanpay-theme");
          var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
