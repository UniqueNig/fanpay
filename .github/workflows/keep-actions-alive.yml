name: Keep scheduled workflows alive

# GitHub automatically disables any scheduled (cron) workflow in a repo that
# has gone 60 days with no push activity — a cleanup measure against
# abandoned repos left running forever. This makes one trivial, empty commit
# (no file changes at all) once a week, purely to reset that clock, so
# keep-render-awake.yml never gets silently paused during a quiet stretch.
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make an empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive (prevents scheduled workflows being disabled after 60 days idle)"
          git push
