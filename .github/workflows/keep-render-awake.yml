name: Keep Render backend awake

# Secondary/backup layer only — UptimeRobot (5-minute checks against
# /health) is the real defense keeping the backend from cold-sleeping, set
# up separately outside this repo. This workflow exists purely as free
# redundancy in case UptimeRobot ever has its own outage.
#
# The schedule below is intentionally hourly, not every-10-minutes: GitHub
# Actions cron is a best-effort CI trigger, not a guaranteed real-time
# scheduler — a tighter schedule was tried and confirmed (by watching actual
# run timestamps) to only fire roughly once every 1.5-2.5 hours regardless
# of what's requested. Asking for hourly here is just honest about what
# GitHub actually delivers, not a functional change from the tighter
# schedule it replaces.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # A cold start can take 30-60+ seconds — give it real room instead of
        # timing out mid-wakeup and reporting a false failure.
        run: curl -fsS --max-time 90 https://fanpay-api-iti0.onrender.com/health
